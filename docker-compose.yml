services:
  backend:
    build:
      context: ./backend
    container_name: trash2treasure-backend
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: trash2treasure-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
